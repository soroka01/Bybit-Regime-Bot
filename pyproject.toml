[project]
name = "tradebot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas", "numpy", "pyarrow", "requests", "httpx",
  "aiogram>=3.13", "fastapi", "uvicorn", "python-dotenv",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
