[project]
name = "tradebot"
version = "0.1.0"
# Нижние границы = версии, на которых бот и тесты реально проверены (Python 3.14). requires-python >= 3.12 следует из numpy 2.5;
# синтаксиса новее 3.11 в самом коде нет (проверено разбором ast и поиском API 3.12+).
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.5", "pandas>=3.0", "pyarrow>=25.0",
  "requests>=2.34",                       # публичные GET свечей и деривативов (market/klines.py, market/derivs.py)
  "httpx>=0.28",                          # приватный API Bybit (trading/exchange.py)
  "aiogram>=3.31",
  "fastapi>=0.142", "uvicorn>=0.54",      # starlette (middleware в web/api.py) приходит вместе с fastapi
  "pydantic>=2.13",                       # модели запросов web/schemas.py (API v2)
  "python-dotenv>=1.2",
  "tzdata; sys_platform == 'win32'",      # zoneinfo("Europe/Moscow") на Windows без базы часовых поясов ОС
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["storage", "web", "node_modules", ".git", "build"]
# По умолчанию запускается быстрый и стабильный набор: без тестов на время (perf, падают под нагрузкой)
# и без тестов на живых данных из storage/ (realdata). Запустить ВСЁ:  python -m pytest -q tests -m ""
# Только отдельную группу:  python -m pytest -q tests -m perf   (или realdata / network)
addopts = "-m 'not perf and not realdata'"
markers = [
  "slow: долгий тест (по умолчанию запускается)",
  "perf: проходит/падает по порогам времени (wall-clock), нестабилен на загруженной машине",
  "realdata: читает живой кэш storage/market или storage/results (пропускается, если файлов нет)",
  "network: ходит в реальную сеть (единственные тесты, которым разрешён сетевой доступ)",
]
